<!DOCTYPE html>
<html>
<head>
<style>
/* unvisited link */
a:link {
  color: red;
}

/* visited link */
a:visited {
  color: green;
}

/* mouse over link */
a:hover {
  color: hotpink;
}

/* selected link */
a:active {
  color: blue;
}
</style>
</head>
<body>

<h1>Style a link depending on state</h1>

<p><a href="default.asp" target="_blank">https://kythuatcongnghe.blu.edu.vn/</a></p>

<p><b>Note:</b> :Khoa Kỹ Thuật và Công Nghệ.</p>
<p><b>Note:</b> :Trường Đại Học Bạc Liêu.</p>

</body>
</html>
