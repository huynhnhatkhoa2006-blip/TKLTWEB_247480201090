<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //CharAt
        var str="javascript";
        document.write(str.charAt(2));

        //concat
        var s1="Java";
        var s2 ="Script";
        var s3 =s1.concat(s2);
        document.write("<br>",s3);

        //tra ve vi tri muc cua chua
        var s1 ="JavaScript";
        var n= s1.indexOf("Script");
        document.write("<br>",n);

        //tra ve vi tri muc cuoi cua chuoi
        var s1="Nguyen Huy";
        var n = s1.lastIndexOf("uy");
        document.write("<br>",n);
        //tra ve chuoi chu thuong
        var s1="JavaScript";
        var s2=s1.toLocaleLowerCase();
        document.write("<br>",s2);
        //tra ve chuoi thuon
        var s1="JavaScript";
        var s2 =s1.toUpperCase();
        document.write("br>",s2);
        // slice
        var s1="JavaScript";
        var s2=s1.slice(3,5);
        document.write(s2);
        // trim 
        var s1="   JavaScript trim     " ;
        var s2 =s1.trim();
        document.write(s2)













































































    </script>
</body>
</html>
